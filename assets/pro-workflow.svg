<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="24" fill="#f4f8ff"/>
  <text x="60" y="70" font-size="38" fill="#0b2d5c" font-family="Arial">Pro 모드 실전 워크플로우</text>

  <g font-family="Arial" font-size="20" text-anchor="middle">
    <g>
      <circle cx="150" cy="300" r="78" fill="#d9e8ff" stroke="#2d7ff9" stroke-width="3"/>
      <text x="150" y="290" fill="#0b2d5c">1. 목표 설정</text>
      <text x="150" y="318" fill="#0b2d5c">(독자/분량/형식)</text>
    </g>
    <g>
      <circle cx="390" cy="300" r="78" fill="#d9e8ff" stroke="#2d7ff9" stroke-width="3"/>
      <text x="390" y="290" fill="#0b2d5c">2. 역할 부여</text>
      <text x="390" y="318" fill="#0b2d5c">(전문가 페르소나)</text>
    </g>
    <g>
      <circle cx="630" cy="300" r="78" fill="#d9e8ff" stroke="#2d7ff9" stroke-width="3"/>
      <text x="630" y="290" fill="#0b2d5c">3. 초안 생성</text>
      <text x="630" y="318" fill="#0b2d5c">(표/문단/요약)</text>
    </g>
    <g>
      <circle cx="870" cy="300" r="78" fill="#d9e8ff" stroke="#2d7ff9" stroke-width="3"/>
      <text x="870" y="290" fill="#0b2d5c">4. 품질 점검</text>
      <text x="870" y="318" fill="#0b2d5c">(누락/오탈자)</text>
    </g>
    <g>
      <circle cx="1080" cy="300" r="78" fill="#2d7ff9" stroke="#1b5fbe" stroke-width="3"/>
      <text x="1080" y="290" fill="white">5. 최종본</text>
      <text x="1080" y="318" fill="white">(즉시 활용)</text>
    </g>
  </g>

  <g stroke="#2d7ff9" stroke-width="4" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#2d7ff9"/>
      </marker>
    </defs>
    <line x1="228" y1="300" x2="310" y2="300"/>
    <line x1="468" y1="300" x2="550" y2="300"/>
    <line x1="708" y1="300" x2="790" y2="300"/>
    <line x1="948" y1="300" x2="998" y2="300"/>
  </g>
</svg>
